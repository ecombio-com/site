name: Oxygen deploy scooterbio (1000186154)

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: oxygen-deploy-1000186154-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy scooterbio to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@12.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@site/hydrogen..."

      - name: Build
        run: pnpm --filter @site/hydrogen run build

      - name: Deploy to Oxygen
        working-directory: apps/hydrogen
        run: pnpm run deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000186154 }}